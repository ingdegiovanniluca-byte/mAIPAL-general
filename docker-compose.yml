services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  # the requests: as many copies as needed (docker compose up -d --scale backend=3), each with
  # WEB_CONCURRENCY processes; no periodic job and no Telegram bot here (see backend/jobs.py)
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      ROLE: api
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      SEARCH_INDEX_URL: ${SEARCH_INDEX_URL-http://qdrant:6333}
    volumes:
      # who may come in as an organization's administrator (org_admins.txt): edited on the server,
      # read again when it changes - no rebuild, no restart
      - ./backend/data/access:/app/data/access
    depends_on:
      - mongodb
      - qdrant

  # the periodic jobs (reminders, presences, summaries, news...) and the Telegram bot. A second copy is
  # a spare: each job runs on one copy at a time, and the bot on the leader only.
  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      ROLE: worker
      SEARCH_INDEX_URL: ${SEARCH_INDEX_URL-http://qdrant:6333}
    volumes:
      - ./backend/data/access:/app/data/access
    depends_on:
      - mongodb
      - qdrant

  # the search index (backend/search_index.py): a copy of what is searchable, so a question searches the whole
  # history. Rebuilt from MongoDB by the worker if lost. Reachable only by backend and worker (no port open).
  qdrant:
    image: qdrant/qdrant:v1.13.6
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: ${APP_BASE_URL}
        PUBLIC_URL: /general
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  qdrant_data:
