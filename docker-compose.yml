services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    volumes:
      # who may come in as an organization's administrator (org_admins.txt): edited on the server,
      # read again when it changes - no rebuild, no restart
      - ./backend/data/access:/app/data/access
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: ${APP_BASE_URL}
        PUBLIC_URL: /general
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo_data:
