# Builds the Galaxy Watch (Wear OS) app: the APK is attached to the run as an artifact
# ("maipal-watch-apk"), ready to install on the watch with adb (see wearos/README.md).
name: Wear OS APK

on:
  push:
    paths:
      - "wearos/**"
      - ".github/workflows/wearos-apk.yml"
  workflow_dispatch:
    inputs:
      maipal_url:
        description: "Indirizzo del server mAIPAL (senza /api)"
        required: false
        default: "https://maipal.it/general"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wearos
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # the GitHub runners already have the Android SDK (ANDROID_HOME)
      - name: Build
        run: ./gradlew assembleDebug --no-daemon -PmaipalUrl="${{ github.event.inputs.maipal_url || 'https://maipal.it/general' }}"
      - uses: actions/upload-artifact@v5
        with:
          name: maipal-watch-apk
          path: wearos/app/build/outputs/apk/debug/app-debug.apk
